cd E:\claurvie

@'
# Render Blueprint for Clarivue AI

services:
  - type: web
    name: clarivue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health

    envVars:
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB_NAME
        value: clarivue_ai

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

      - key: FRONTEND_ORIGIN
        sync: false

      - key: STORAGE_ROOT
        value: /tmp/clarivue-storage

      - key: JWT_SECRET_KEY
        sync: false

      - key: REQUIRE_JWT_AUTH
        value: "true"

      - key: ENABLE_DEMO_ENDPOINTS
        value: "false"
'@ | Set-Content -Encoding utf8 render.yaml